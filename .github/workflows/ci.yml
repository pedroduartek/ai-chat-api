name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ai-chat-api.sln

      - name: Build
        run: dotnet build ai-chat-api.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ai-chat-api.sln

      - name: Build
        run: dotnet build ai-chat-api.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Api.Tests/Api.Tests.csproj --no-build --configuration Release --verbosity normal
