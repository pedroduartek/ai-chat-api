version: "3.8"
services:
  api:
    build: ./src/Api
    image: ai-chat-api:phase1
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=small-llama
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Intentionally do NOT publish Ollama ports to the host — internal only
    volumes:
      - ollama_data:/var/lib/ollama
    environment:
      - OLLAMA_ALLOW_PRE_RELEASE=true

volumes:
  ollama_data:
