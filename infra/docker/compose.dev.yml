version: "3.8"
# Development compose with Ollama (dev may expose Ollama port to host for convenience)

services:
  api:
    build: ../../src/Api
    image: ai-chat-api:dev
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Dev: optionally publish Ollama to host for debugging
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/var/lib/ollama
    environment:
      - OLLAMA_ALLOW_PRE_RELEASE=true

volumes:
  ollama_data:
