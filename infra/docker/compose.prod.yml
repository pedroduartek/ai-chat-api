version: "3.8"

# Production docker-compose for a single VPS. Exposes only ports 80 and 443 via Caddy.
# Place your `.env` file in this directory on the VPS (see .env.example).

services:
  api:
    image: ai-chat-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_URLS=http://+:80
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # IMPORTANT: do NOT publish Ollama's port in production — internal only
    volumes:
      - ollama_data:/var/lib/ollama
    environment:
      - OLLAMA_ALLOW_PRE_RELEASE=true
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
