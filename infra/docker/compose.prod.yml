version: "3.8"

# Production docker-compose for a single VPS. Exposes only ports 80 and 443 via Caddy.
# Place your `.env` file in this directory on the VPS (see .env.example).


services:
  api:
    build:
      context: ../..                      # /opt/pedro-chat
      dockerfile: apps/chat-api/Dockerfile
    image: ai-chat-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_URLS=http://+:80
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    networks:
      - internal


  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # IMPORTANT: do NOT publish Ollama's port in production — internal only
    # Mount the persistent volume to the container path(s) Ollama may use for models.
    # Some images use /var/lib/ollama, others use /root/.ollama — mounting to both
    # ensures persisted models survive restarts regardless of internal path.
    volumes:
      - ollama_data:/var/lib/ollama
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ALLOW_PRE_RELEASE=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # Note: keep Caddy publicly exposed on 80/443 only. Optionally add a simple
  # healthcheck if your environment requires it.

volumes:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
